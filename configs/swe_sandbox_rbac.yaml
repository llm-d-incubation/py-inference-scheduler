# Lets verl agent-loop workers (Ray pods, default/default SA) manage SWE
# rollout sandboxes in the policy-exempt agents-system namespace:
# create/delete Sandbox CRs, watch their pods, and exec commands in them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: swe-sandbox-manager
  namespace: agents-system
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: swe-sandbox-manager
  namespace: agents-system
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
roleRef:
  kind: Role
  name: swe-sandbox-manager
  apiGroup: rbac.authorization.k8s.io
